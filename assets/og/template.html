<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card source</title>
<!--
  Source for og-image.png (1200x630 social share card).
  Render with: node assets/og/build.js

  It mirrors the site: Archivo on the pale drafting-film paper, the name set
  wide, the role line, and a small copy of the staged scrap-rate chart
  (5% before, 0.5% after, $15 million a year). The name and role are read
  from index.html at build time; the chart values are the same fixed figures
  the page charts. No stat strip, no all-caps.
-->
<style>
@font-face {
    font-family: 'Archivo';
    src: url('../fonts/archivo-var-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-style: normal;
}

:root {
    --paper: #F2F4F3;
    --ink: #17202B;
    --graphite: #4A5663;
    --oc: #A61E3B;
    --ic: #176B48;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    overflow: hidden;
}

body {
    position: relative;
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
}

.headshot {
    position: absolute;
    top: 72px;
    right: 72px;
    width: 360px;
    height: 360px;
    object-fit: cover;
    object-position: 50% 35%;
}

.name {
    position: absolute;
    top: 64px;
    left: 72px;
    font-size: 96px;
    font-stretch: 112%;
    font-weight: 640;
    line-height: 1;
    letter-spacing: -0.01em;
    white-space: nowrap;
}

.role {
    position: absolute;
    top: 186px;
    left: 72px;
    width: 664px;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.25;
}

/* The staged chart, at card size. Same geometry as the page: a 0 to 6%
   axis, the before level at 5, the after level at 0.5, a solid drop on
   the dashed stage line. */
.chart {
    position: absolute;
    top: 290px;
    left: 72px;
    width: 600px;
}

.chart-title {
    font-size: 22px;
    font-stretch: 106%;
    font-weight: 600;
    line-height: 1.3;
}

.plot {
    position: relative;
    height: 170px;
    margin: 28px 0 0 0;
    border-left: 2px solid var(--graphite);
    border-bottom: 2px solid var(--graphite);
}

.stage {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    margin-left: -1px;
    border-left: 2px dashed var(--graphite);
}

.line {
    position: absolute;
    height: 0;
    margin-top: -3px;
    border-top: 6px solid;
}

.before { top: 16.667%; left: 0; right: calc(50% - 3px); border-color: var(--oc); }
.after { top: 91.667%; left: calc(50% - 3px); right: 0; border-color: var(--ic); }

.drop {
    position: absolute;
    top: calc(16.667% - 3px);
    bottom: calc(8.333% - 3px);
    left: 50%;
    margin-left: -3px;
    border-left: 6px solid var(--ink);
}

.lab {
    position: absolute;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    font-variant-numeric: tabular-nums lining-nums;
}

.lab-before { left: 14px; bottom: calc(83.333% + 8px); color: var(--oc); }
.lab-after { left: calc(50% + 16px); bottom: calc(8.333% + 10px); color: var(--ic); }

.result {
    position: absolute;
    left: calc(50% + 16px);
    bottom: calc(8.333% + 48px);
    font-size: 26px;
    font-stretch: 106%;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
}

.xaxis {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 8px 0 0 14px;
    font-size: 20px;
    font-weight: 600;
}

.xaxis span + span { padding-left: 16px; }
.x-before { color: var(--oc); }
.x-after { color: var(--ic); }

.domain {
    position: absolute;
    right: 72px;
    bottom: 64px;
    color: var(--graphite);
    font-size: 24px;
    font-weight: 500;
}
</style>
</head>
<body>
    <img class="headshot" src="../../vishut-dhar-headshot.jpg" alt="">

    <div class="name">Vishut Dhar</div>
    <div class="role">Senior Supplier Quality Engineer at General Motors</div>

    <div class="chart">
        <div class="chart-title">Scrap rate at GM Spring Hill</div>
        <div class="plot">
            <span class="stage"></span>
            <span class="line before"></span>
            <span class="drop"></span>
            <span class="line after"></span>
            <span class="lab lab-before">5%</span>
            <span class="lab lab-after">0.5%</span>
            <span class="result">$15 million saved a year</span>
        </div>
        <div class="xaxis"><span class="x-before">Before</span><span class="x-after">After</span></div>
    </div>

    <div class="domain">vishutdhar.com</div>
</body>
</html>
